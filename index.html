<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Raksha Bandhan, Behen!</title>
    <style>
        /* Deep Night Sky Background with Gradient */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0b091a 0%, #161233 50%, #2c1654 100%);
            font-family: 'Poppins', Arial, sans-serif;
            overflow-x: hidden;
            color: #ffffff;
            padding: 40px 0; /* Extra space for scrolling on mobile */
        }

        /* Sparkle Stars in the Night Sky */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.6;
            z-index: 0;
        }

        /* Main Greeting Card Container */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 217, 0, 0.4);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 217, 0, 0.1);
            max-width: 450px;
            width: 90%;
            z-index: 10;
            animation: fadeIn 1.5s ease-out;
            margin: auto;
        }

        /* Photo Gallery Styling */
        .photo-gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 25px 0;
        }

        .sister-photo {
            width: 100%;
            max-height: 300px;
            object-fit: cover; /* Keeps image looking clean, not stretched */
            border-radius: 12px;
            border: 3px solid rgba(255, 217, 0, 0.6);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .sister-photo:hover {
            transform: scale(1.03); /* Slight zoom on hover */
        }

        /* Festive Rakhi Image/Emoji Placeholder */
        .rakhi-icon {
            font-size: 70px;
            margin-bottom: 10px;
            animation: pulse 2s infinite ease-in-out;
            display: inline-block;
        }

        h1 {
            color: #ffd700;
            font-size: 2.5rem;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #f0f0f0;
            margin: 20px 0;
        }

        .heart {
            color: #ff4757;
            animation: beat 0.5s infinite alternate;
            display: inline-block;
        }

        /* Falling Flowers Styling */
        .petal {
            position: fixed; /* Fixed so flowers fall relative to screen, not card size */
            background-color: #ffb7c5;
            border-radius: 150% 0 150% 0;
            pointer-events: none;
            z-index: 1;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,217,0,0.4)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(255,217,0,0.8)); }
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="card">
        <div class="rakhi-icon">🪮✨💝</div>
        <h1>Happy Raksha Bandhan!</h1>
        
        <!-- Photo Gallery Container with 3 images -->
        <div class="photo-gallery">
            <!-- REPLACE THE LINKS BELOW WITH YOUR COPIED DIRECT LINKS -->
            <img src="https://i.postimg.cc/Hnqjdkzx/Photo-Enhancement-Request-Google-Chrome-8-12-2026-10-09-17-PM.png" alt="Memories 1" class="sister-photo">
            <img src="https://i.postimg.cc/nztx1S2d/Chat-GPT-Image-Aug-12-2026-10-12-28-PM.png" alt="Memories 2" class="sister-photo">
            <img src="https://i.postimg.cc/gkBP724m/Chat-GPT-Image-Aug-12-2026-10-11-10-PM.png" alt="Memories 3" class="sister-photo">
        </div>

        <p>To my dearest, most amazing <b>Behen</b>,</p>
        <p>Thank you for always protecting me, scolding me, laughing with me, and being my best friend for life. This sky is full of stars, but you shine the brightest! ✨</p>
        <p>With love always, <br><span class="heart">❤️</span> Your Brother</p>
    </div>

    <script>
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 15 + 10 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            
            petal.style.left = Math.random() * window.innerWidth + 'px';
            petal.style.top = '-20px';
            
            const colors = ['#ffb7c5', '#ff9a9e', '#fecfef', '#ff4b5c'];
            petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            const duration = Math.random() * 3 + 4 + 's';
            const horizontalDrift = (Math.random() * 200 - 100) + 'px';
            
            petal.style.animation = `fall ${duration} linear forwards`;
            
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fall {
                    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
                    10% { opacity: 0.9; }
                    100% { transform: translateY(${window.innerHeight + 50}px) translateX(${horizontalDrift}) rotate(${Math.random() * 360}deg); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
            document.body.appendChild(petal);

            setTimeout(() => {
                petal.remove();
                style.remove();
            }, parseFloat(duration) * 1000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            for(let i = 0; i < 30; i++) {
                setTimeout(createPetal, Math.random() * 1000);
            }
            setInterval(createPetal, 150);
        });
    </script>
</body>
</html>
